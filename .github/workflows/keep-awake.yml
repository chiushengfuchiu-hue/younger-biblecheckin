
name: Keep Streamlit Awake

on:
  schedule:
    # UTC 22:00, 06:00, 14:00
    # Taiwan 06:00, 14:00, 22:00
    - cron: '0 22,6,14 * * *'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit Streamlit app
        env:
          APP_URL: https://younger-biblecheckin-8tlpl3g9hoxqngs6xjswgr.streamlit.app/
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(
                  os.environ["APP_URL"],
                  wait_until="domcontentloaded",
                  timeout=60000
              )
              page.wait_for_timeout(15000)
              print("Page title:", page.title())
              print("Final URL:", page.url)

              wake = page.get_by_role(
                  "button",
                  name="Yes, get this app back up!"
              )
              if wake.count() > 0:
                  wake.first.click()
                  page.wait_for_timeout(30000)

              page.screenshot(
                  path="streamlit-check.png",
                  full_page=True
              )
              browser.close()
          PY

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-check
          path: streamlit-check.png
          if-no-files-found: ignore
